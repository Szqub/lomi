name: "remote prototypes (unqualified)"

on:
  push:
    branches: ["main", "remote-foundation"]
    paths:
      - ".github/workflows/remote-prototypes.yml"
      - "src-tauri/crates/lomi-session-core/**"
      - "src-tauri/crates/lomi-session-host/**"
      - "src-tauri/crates/lomi-remote-crypto/**"
  pull_request:
    paths:
      - ".github/workflows/remote-prototypes.yml"
      - "src-tauri/crates/lomi-session-core/**"
      - "src-tauri/crates/lomi-session-host/**"
      - "src-tauri/crates/lomi-remote-crypto/**"

permissions:
  contents: read

concurrency:
  group: remote-prototypes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.crate }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ["macos-latest", "ubuntu-24.04"]
        crate: ["lomi-session-core", "lomi-session-host", "lomi-remote-crypto"]
    defaults:
      run:
        shell: bash
    env:
      CRATE_MANIFEST: src-tauri/crates/${{ matrix.crate }}/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: install prototype Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: check Rust formatting
        run: cargo fmt --manifest-path "$CRATE_MANIFEST" --check

      - name: check standalone crate
        run: cargo check --manifest-path "$CRATE_MANIFEST" --locked

      - name: test standalone crate
        run: cargo test --manifest-path "$CRATE_MANIFEST" --locked

      - name: lint standalone crate
        run: cargo clippy --manifest-path "$CRATE_MANIFEST" --locked --all-targets -- -D warnings

      - name: test browser API and explicit fixtures on native
        if: matrix.crate == 'lomi-remote-crypto'
        run: |
          cargo check --manifest-path "$CRATE_MANIFEST" --locked --features browser,test-fixtures
          cargo test --manifest-path "$CRATE_MANIFEST" --locked --features browser,test-fixtures
          cargo clippy --manifest-path "$CRATE_MANIFEST" --locked --all-targets --features browser,test-fixtures -- -D warnings

  wasm:
    name: crypto WASM compilation (unqualified)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: install prototype Rust WASM target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      # Compilation does not qualify browser runtime, key erasure, or S01.
      - name: check ephemeral browser build
        run: cargo check --manifest-path src-tauri/crates/lomi-remote-crypto/Cargo.toml --locked --target wasm32-unknown-unknown --features browser

      - name: check explicit interoperability fixture build
        run: cargo check --manifest-path src-tauri/crates/lomi-remote-crypto/Cargo.toml --locked --target wasm32-unknown-unknown --features browser,test-fixtures
