name: Installer qualification

on:
  workflow_dispatch:
  push:
    branches: ["codex/custom-api-*"]
    paths:
      - ".github/workflows/installers.yml"
      - "scripts/qualify-installers*"

permissions:
  contents: read

jobs:
  installers:
    name: Installers (${{ matrix.platform }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: nsis,msi
          - platform: macos-latest
            bundles: app,dmg
          - platform: macos-15-intel
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/target
          key: installers-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: installers-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Select release Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm cpio xvfb xdotool dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Configure unsigned qualification artifacts
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('src-tauri/qualification.conf.json', JSON.stringify({
            bundle: { createUpdaterArtifacts: false,
              ...(process.platform === 'darwin' ? { macOS: { signingIdentity: '-' } } : {}) }
          }));
          JS
      - name: Build production-feature installers
        run: pnpm tauri build --config src-tauri/qualification.conf.json --bundles ${{ matrix.bundles }} -- --locked
      - name: Qualify Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/qualify-installers-linux.sh
      - name: Qualify macOS disk image
        if: runner.os == 'macOS'
        run: bash scripts/qualify-installers-macos.sh
      - name: Qualify Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/qualify-installers-windows.ps1
      - name: Retain qualification reports and test installers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installers-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            installer-results/
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
