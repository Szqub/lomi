<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{title}} · Lomi</title>
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("data:font/woff2;base64,{{geist_latin_ext}}") format("woff2");
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }

      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("data:font/woff2;base64,{{geist_latin}}") format("woff2");
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }

      :root {
        color-scheme: light;
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        --canvas: #f7f8f3;
        --text: #0b0d0c;
        --text-soft: #535c56;
        background: var(--canvas);
        color: var(--text);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        position: relative;
        isolation: isolate;
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        line-height: 1.5;
      }

      .sky-background {
        position: fixed;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .sky-background img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: grayscale(1);
      }

      .sky-background::after {
        position: absolute;
        inset: 0;
        background: #f7f8f3b8;
        content: "";
      }

      .wordmark {
        position: absolute;
        z-index: 1;
        top: 49px;
        left: 50%;
        display: block;
        width: 112px;
        height: auto;
        transform: translateX(-50%);
      }

      main {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 136px 24px 88px;
        text-align: center;
      }

      h1 {
        max-width: 620px;
        margin: 0 0 12px;
        font-size: clamp(32px, 4vw, 40px);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      p {
        max-width: 460px;
        margin: 0;
        color: var(--text-soft);
        font-size: 15px;
        line-height: 1.55;
        text-wrap: pretty;
      }

      @media (max-width: 600px) {
        .wordmark {
          top: 36px;
          width: 96px;
        }

        .sky-background img {
          object-position: 47% center;
        }
      }
    </style>
  </head>
  <body data-state="{{state}}">
    <div class="sky-background" aria-hidden="true">
      <img src="data:image/webp;base64,{{cloud}}" alt="" />
    </div>
    <img class="wordmark" src="data:image/svg+xml;base64,{{wordmark}}" alt="Lomi" />
    <main aria-labelledby="title" {{role}}>
      <h1 id="title">{{title}}</h1>
      <p>{{message}}</p>
    </main>
  </body>
</html>
